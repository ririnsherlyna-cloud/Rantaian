<script>
/* V299-SASARAN-OTAK — kebenaran utama langsung dari otak Next.js (jembatan otak).
   Membaca arena-keadaan.json (otakPicks) dan menampilkannya sebagai panel pertama.
   Jujur V274: bila otakPicks tak ada/basi, panel diam — tanpa karangan. */
(function () {
  function kali(iso) { try { return Math.round((Date.now() - new Date(iso).getTime()) / 60000); } catch (e) { return null; } }
  function render(d) {
    var o = d && d.otakPicks;
    if (!o || !o.today || o.today !== d.today) return;
    var host = document.getElementById('sasaran5Panel');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'panel'; el.id = 'otakPicksPanel'; el.style.padding = '0';
    var mnt = kali(o.diperbarui);
    var html = '<div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<span style="font-weight:800;letter-spacing:.5px">SASARAN OTAK AGI — KEPUTUSAN LANGSUNG OTAK NEXT.JS</span>' +
      '<span class="chip" style="background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.35)">SATU KEBENARAN V299</span>' +
      '<span style="opacity:.6;font-size:12px">hari ' + o.today + (mnt != null ? ' • diperbarui ' + mnt + ' mnt lalu' : '') + '</span></div>' +
      '<div style="opacity:.7;font-size:12.5px;margin-top:4px">' + (o.ket || '') + '</div></div>';
    var hidup = o.arenaHidup || [];
    for (var i = 0; i < hidup.length; i++) {
      var a = hidup[i];
      var warna = a.direction === 'BUY' ? '#34d399' : '#f87171';
      html += '<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap">' +
        '<div><b class="mono">' + (a.symbol || '').replace('USDT', '') + '</b>' +
        ' <span style="color:' + warna + ';font-weight:700">' + (a.direction || '-') + '</span>' +
        ' <span style="opacity:.7;font-size:12px">vonis ' + (a.vonis || '-') + '</span></div>' +
        '<div style="text-align:right;font-size:12.5px">' +
        '<span class="mono">entry ' + (a.entryClose != null ? a.entryClose : '-') + '</span>' +
        ' <span class="mono" style="color:' + (a.liveRetPct >= 0 ? '#34d399' : '#f87171') + '">' + (a.liveRetPct != null ? (a.liveRetPct > 0 ? '+' : '') + a.liveRetPct + '%' : '') + '</span>' +
        '<div style="opacity:.6;font-size:11.5px">harga hidup ' + (a.livePrice != null ? a.livePrice : '-') + '</div></div></div>';
    }
    if (!hidup.length) html += '<div style="padding:12px 16px;opacity:.7;font-size:13px">Arena hidup belum terbaca kali ini — jujur menunggu denyut jembatan berikutnya.</div>';
    html += '<div style="padding:9px 16px;opacity:.55;font-size:11.5px;border-top:1px solid rgba(255,255,255,.06)">Sumber: otak AGI asli (Next.js + memori Prisma) diterbitkan otomatis jembatan satu-kebenaran — sama persis dengan versi ber-otak; SAKTI server tetap berdenyut sebagai suara kedua di bawah.</div>';
    el.innerHTML = html;
    host.parentNode.insertBefore(el, host);
  }
  fetch('arena-keadaan.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(render).catch(function () {});
})();
</script>
